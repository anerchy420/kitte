<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>キッティング進捗</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-box">
      <h1>キッティング進捗</h1>
      <div id="login-step1">
        <label>チームのパスコード
          <input id="pass" type="password" autocomplete="current-password" placeholder="パスコード">
        </label>
        <button id="pass-go" class="btn primary block">次へ</button>
        <p class="muted small">初回は新しいパスコードを入力すると、そのパスコード用のデータ置き場が作られます。全員が同じパスコードを使ってください。</p>
      </div>
      <div id="login-step2" class="hidden">
        <p>あなたの名前を選んでください</p>
        <div id="name-list" class="name-list"></div>
        <div class="row">
          <input id="new-name" placeholder="名前を追加">
          <button id="new-name-go" class="btn">追加</button>
        </div>
      </div>
      <p id="login-msg" class="error"></p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="title">
        <span id="today-label"></span>
        <span id="sync" class="sync" title="同期状態"></span>
      </div>
      <button id="me-chip" class="chip me"></button>
    </header>
    <div id="demo-banner" class="banner hidden">デモモード：データはこの端末のブラウザ内だけに保存されます（README参照でFirebase設定）</div>

    <main>
      <section id="tab-home" class="tab"></section>
      <section id="tab-list" class="tab hidden"></section>
      <section id="tab-io" class="tab hidden"></section>
      <section id="tab-history" class="tab hidden"></section>
      <section id="tab-settings" class="tab hidden"></section>
    </main>

    <nav class="bottom">
      <button data-tab="home" class="active"><span class="ico">📊</span>ホーム</button>
      <button data-tab="list"><span class="ico">📋</span>一覧</button>
      <button data-tab="io"><span class="ico">⇅</span>入出力</button>
      <button data-tab="history"><span class="ico">📈</span>進捗</button>
      <button data-tab="settings"><span class="ico">⚙</span>設定</button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="backdrop hidden"></div>
  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
